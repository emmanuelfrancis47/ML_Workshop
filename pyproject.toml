[project]
name = "ml-workshop"
version = "0.1.0"
description = "RAAP Univen / SARAO workshop: radio source finding with PyBDSF on MIGHTEE DR1"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Emmanuel Ocran" },
    { name = "Daniel Egbo" },
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astroml>=1.0.2.post1",
    "astropy>=6.1.7",
    "astroquery>=0.4.11",
    "bdsf[ishell]>=1.14.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "notebook>=7.6.3",
    "radio-beam>=0.3.10",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]
